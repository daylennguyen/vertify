<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-labelledby="title desc">
  <title id="title">vertify letterbox flip</title>
  <desc id="desc">A 16:9 landscape frame is preserved and placed on a 9:16 canvas with blurred bars, never cropped.</desc>
  <rect width="720" height="280" rx="20" fill="#F7FBFC"/>
  <text x="36" y="42" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#44565E">16:9 landscape</text>
  <rect x="36" y="58" width="288" height="162" rx="10" fill="#121C22"/>
  <rect x="46" y="68" width="268" height="142" rx="6" fill="#C6D6DC"/>
  <text x="180" y="142" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#101C22">full frame</text>
  <text x="180" y="164" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#44565E">never cropped</text>
  <path d="M348 139h44" stroke="#D67A20" stroke-width="3" stroke-linecap="round"/>
  <path d="M380 128l16 11-16 11" fill="none" stroke="#D67A20" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="548" y="42" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#44565E">9:16 with blur bars</text>
  <rect x="502" y="54" width="92" height="188" rx="16" fill="#121C22"/>
  <rect x="510" y="66" width="76" height="36" rx="4" fill="#7FA3B0"/>
  <rect x="510" y="106" width="76" height="78" rx="4" fill="#C6D6DC"/>
  <rect x="510" y="188" width="76" height="36" rx="4" fill="#7FA3B0"/>
  <text x="548" y="88" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#F7FBFC">blur</text>
  <text x="548" y="148" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#101C22">frame</text>
  <text x="548" y="210" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#F7FBFC">blur</text>
</svg>
