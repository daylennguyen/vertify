name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-main
  cancel-in-progress: true

permissions:
  contents: write

# Releases are created with this repo's GITHUB_TOKEN (github-actions[bot]
# on daylennguyen/vertify). Never a GoDaddy / dnguyen1-godaddy identity.
jobs:
  meta:
    name: Version
    if: github.repository_owner == 'daylennguyen'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      slug: ${{ steps.v.outputs.slug }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | sed 's/^version = "\(.*\)"/\1/')
          slug="${version}-${GITHUB_SHA::7}"
          tag="v${slug}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "slug=${slug}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Publishing ${tag} from ${GITHUB_SHA}"

  build:
    name: build-${{ matrix.name }}
    needs: meta
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x64
            archive: tar.gz
          - os: windows-latest
            name: windows-x64
            archive: zip
          - os: macos-latest
            name: macos-arm64
            archive: tar.gz
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libxkbcommon-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            xz-utils

      - name: Build
        run: cargo build --release --locked --bins

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          chmod +x scripts/vendor-ffmpeg.sh
          stage="vertify-${{ needs.meta.outputs.tag }}-${{ matrix.name }}"
          mkdir -p "$stage"
          cp target/release/vertify "$stage/"
          cp target/release/vertify-gui "$stage/"
          cp README.md LICENSE CHANGELOG.md THIRD_PARTY.md "$stage/"
          ./scripts/vendor-ffmpeg.sh "$stage"
          tar -czf "${stage}.tar.gz" "$stage"

      - name: Package (Windows portable + installer)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $slug = "${{ needs.meta.outputs.slug }}"
          $tag = "${{ needs.meta.outputs.tag }}"
          $payload = "installer\windows\payload"
          New-Item -ItemType Directory -Force -Path $payload | Out-Null
          Copy-Item target\release\vertify.exe $payload\
          Copy-Item target\release\vertify-gui.exe $payload\
          Copy-Item README.md, LICENSE, CHANGELOG.md, THIRD_PARTY.md $payload\
          & scripts\vendor-ffmpeg.ps1 -DestDir (Resolve-Path $payload)

          $stage = "vertify-$tag-${{ matrix.name }}"
          if (Test-Path $stage) { Remove-Item -Recurse -Force $stage }
          Copy-Item -Recurse $payload $stage
          Compress-Archive -Path $stage -DestinationPath "$stage.zip"

          choco install innosetup -y --no-progress
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DMyAppVersion=$slug" installer\windows\vertify.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compiler failed: $LASTEXITCODE" }
          Copy-Item installer\windows\Output\VertifySetup-*.exe .

      - uses: actions/upload-artifact@v4
        with:
          name: vertify-${{ matrix.name }}
          path: vertify-*.${{ matrix.archive }}

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: vertify-windows-installer
          path: VertifySetup-*.exe

  publish:
    name: GitHub Release
    needs: [meta, build]
    if: github.repository_owner == 'daylennguyen' && success()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt

      - name: Publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          case "${GITHUB_ACTOR}" in
            daylennguyen|github-actions[bot]) ;;
            *)
              echo "Refusing to publish as '${GITHUB_ACTOR}'. Owner must be daylennguyen (never dnguyen1-godaddy)."
              exit 1
              ;;
          esac
          tag="${{ needs.meta.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* \
              --target "$GITHUB_SHA" \
              --title "$tag" \
              --generate-notes \
              --latest
          fi
