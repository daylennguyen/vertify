name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: build-${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x64
            archive: tar.gz
          - os: windows-latest
            name: windows-x64
            archive: zip
          - os: macos-latest
            name: macos-arm64
            archive: tar.gz
          - os: macos-13
            name: macos-x64
            archive: tar.gz
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libxkbcommon-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            xz-utils

      - name: Build
        run: cargo build --release --locked --bins

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          chmod +x scripts/vendor-ffmpeg.sh
          stage="vertify-${{ github.ref_name }}-${{ matrix.name }}"
          mkdir -p "$stage"
          cp target/release/vertify "$stage/"
          cp target/release/vertify-gui "$stage/"
          cp README.md LICENSE CHANGELOG.md THIRD_PARTY.md "$stage/"
          ./scripts/vendor-ffmpeg.sh "$stage"
          tar -czf "${stage}.tar.gz" "$stage"

      - name: Package (Windows portable + installer)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $payload = "installer\windows\payload"
          New-Item -ItemType Directory -Force -Path $payload | Out-Null
          Copy-Item target\release\vertify.exe $payload\
          Copy-Item target\release\vertify-gui.exe $payload\
          Copy-Item README.md, LICENSE, CHANGELOG.md, THIRD_PARTY.md $payload\
          & scripts\vendor-ffmpeg.ps1 -DestDir (Resolve-Path $payload)

          $stage = "vertify-${{ github.ref_name }}-${{ matrix.name }}"
          if (Test-Path $stage) { Remove-Item -Recurse -Force $stage }
          Copy-Item -Recurse $payload $stage
          Compress-Archive -Path $stage -DestinationPath "$stage.zip"

          choco install innosetup -y --no-progress
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DMyAppVersion=$version" installer\windows\vertify.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compiler failed: $LASTEXITCODE" }
          Copy-Item installer\windows\Output\VertifySetup-*.exe .

      - uses: actions/upload-artifact@v4
        with:
          name: vertify-${{ matrix.name }}
          path: vertify-*.${{ matrix.archive }}

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: vertify-windows-installer
          path: VertifySetup-*.exe

  publish:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt

      - name: Publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* \
              --title "$tag" \
              --notes-file CHANGELOG.md
          fi
